name: Anime Witcher Web Verify

on:
  push:
    branches: [anime-witcher-web]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          FIREBASE_PROJECT_ID: animewitcher-1c66d
          FIREBASE_WEB_API_KEY: AIzaSyAcbWRwfFNnCpoydDXlEALWnM_TYVcJOMU
        run: npm run build

      - name: Start production server
        env:
          FIREBASE_PROJECT_ID: animewitcher-1c66d
          FIREBASE_WEB_API_KEY: AIzaSyAcbWRwfFNnCpoydDXlEALWnM_TYVcJOMU
          BUNNY_AUTH_KEY: ${{ secrets.BUNNY_AUTH_KEY }}
        run: |
          npm start > /tmp/anime-witcher-next.log 2>&1 &
          echo $! > /tmp/anime-witcher-next.pid
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/anime-witcher-next.log
          exit 1

      - name: Verify real home, native lists, routes and servers
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = 'http://127.0.0.1:3000';
          const checkPage = async (path) => {
            const r = await fetch(base + path, { redirect: 'follow' });
            console.log('PAGE', path.split('?')[0], r.status);
            if (r.status !== 200) throw new Error(`${path} returned ${r.status}`);
            return r;
          };
          const getJson = async (path) => {
            const r = await fetch(base + path);
            if (!r.ok) throw new Error(`${path} returned ${r.status}: ${(await r.text()).slice(0,160)}`);
            return r.json();
          };

          (async () => {
            await checkPage('/');
            const home = await getJson('/api/home');
            const keys = ['hero','recent','popular','bestMal','animations','latest','news'];
            const counts = Object.fromEntries(keys.map(k => [k, Array.isArray(home[k]) ? home[k].length : -1]));
            console.log('CURRENT_SEASON', JSON.stringify(home.currentSeason || ''));
            console.log('HOME_COUNTS', JSON.stringify(counts));
            for (const k of keys) {
              if (!Array.isArray(home[k]) || home[k].length === 0) throw new Error(`Home section ${k} is empty`);
            }
            if (!home.recent.every(x => x.poster)) throw new Error('Newest episodes must carry anime posters');
            console.log('RECENT_POSTERS', home.recent.length);

            await checkPage('/catalog/anime');
            await checkPage('/rankings');
            await checkPage('/show-times');
            await checkPage(`/category/${encodeURIComponent('اكشن')}`);
            await checkPage('/search?q=Naruto');
            const search = await getJson('/api/search?q=Naruto&index=series');
            console.log('SEARCH_ITEMS', Array.isArray(search.items) ? search.items.length : 0);
            if (!Array.isArray(search.items) || !search.items.length) throw new Error('Real search returned no items');

            const candidates = [...home.hero, ...home.latest, ...search.items].filter(Boolean);
            let chain = null;
            for (const anime of candidates.slice(0, 20)) {
              const animeId = String(anime.id || anime.objectID || '');
              if (!animeId) continue;
              try {
                const episodesPayload = await getJson(`/api/anime/${encodeURIComponent(animeId)}/episodes`);
                const episodes = Array.isArray(episodesPayload) ? episodesPayload : (episodesPayload.episodes || episodesPayload.items || []);
                for (const episode of episodes.slice(0, 4)) {
                  const episodeId = String(episode.id || episode.doc_id || episode.order || '');
                  if (!episodeId) continue;
                  const serversPayload = await getJson(`/api/anime/${encodeURIComponent(animeId)}/episodes/${encodeURIComponent(episodeId)}/servers`);
                  const servers = Array.isArray(serversPayload) ? serversPayload : (serversPayload.items || serversPayload.servers || []);
                  if (servers.length) { chain = { animeId, episodeId, episodes, servers }; break; }
                }
                if (chain) break;
              } catch {}
            }
            if (!chain) throw new Error('Could not find a real anime/episode/server chain');

            console.log('REAL_ANIME_ID', chain.animeId);
            console.log('EPISODE_COUNT', chain.episodes.length);
            console.log('REAL_EPISODE_ID', chain.episodeId);
            console.log('SERVER_COUNT', chain.servers.length);

            const animePath = `/anime/${encodeURIComponent(chain.animeId)}`;
            await checkPage(animePath);
            await checkPage(`${animePath}/episodes`);
            await checkPage(`/watch/${encodeURIComponent(chain.animeId)}/${encodeURIComponent(chain.episodeId)}`);
            const details = await getJson(`/api${animePath}`);
            if (!details || details.error) throw new Error('Real anime details API failed');

            const targetNames = ['MF2','ST','KF','PD'];
            const directReport = [];
            for (const name of targetNames) {
              const index = chain.servers.findIndex(s => String(s.name || '').toUpperCase() === name && /1080/.test(String(s.quality || '')));
              if (index < 0) continue;
              const r = await fetch(`${base}/api/anime/${encodeURIComponent(chain.animeId)}/episodes/${encodeURIComponent(chain.episodeId)}/servers?resolve=${index}`);
              const text = await r.text();
              if (!r.ok) throw new Error(`${name} direct resolution failed ${r.status}: ${text.slice(0,180)}`);
              const resolved = JSON.parse(text);
              if (!resolved?.url) throw new Error(`${name} resolved without URL`);
              if (/streamtape\.(?:com|to)\/v\/|krakenfiles\.com\/view\/|pixeldrain\.com\/u\//i.test(resolved.url)) throw new Error(`${name} still resolved to a provider webpage: ${resolved.url}`);
              directReport.push({name,quality:resolved.quality,host:new URL(resolved.url).host});
            }
            console.log('DIRECT_SERVER_REPORT', JSON.stringify(directReport));

            let playable = null;
            const maxServers = Math.min(chain.servers.length, 15);
            for (let i = 0; i < maxServers; i++) {
              try {
                const r = await fetch(`${base}/api/anime/${encodeURIComponent(chain.animeId)}/episodes/${encodeURIComponent(chain.episodeId)}/servers?resolve=${i}`);
                if (!r.ok) continue;
                const resolved = await r.json();
                if (!resolved?.url) continue;
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 12000);
                try {
                  const media = await fetch(resolved.url, { redirect: 'follow', signal: controller.signal, headers: { 'User-Agent': 'Mozilla/5.0', Range: 'bytes=0-2047' } });
                  const type = media.headers.get('content-type') || '';
                  const buf = Buffer.from(await media.arrayBuffer());
                  const text = buf.subarray(0, 2048).toString('utf8');
                  const hls = text.includes('#EXTM3U') || /mpegurl/i.test(type);
                  const binaryMedia = media.ok && buf.length > 0 && (/video|octet-stream/i.test(type) || /\.mp4(?:\?|$)/i.test(resolved.url) || /\/api\/file\//i.test(resolved.url));
                  if (hls || binaryMedia) { playable = { index:i,name:resolved.name,quality:resolved.quality,status:media.status,type,hls }; break; }
                } finally { clearTimeout(timer); }
              } catch {}
            }
            if (!playable) throw new Error('Server records exist, but no tested server resolved to readable MP4/HLS media');
            console.log('PLAYABLE_SERVER', JSON.stringify(playable));
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Check Vercel deployment credential availability
        env:
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_BUNNY_KEY: ${{ secrets.BUNNY_AUTH_KEY != '' }}
        run: |
          echo "VERCEL_TOKEN_AVAILABLE=$HAS_VERCEL_TOKEN"
          echo "BUNNY_AUTH_KEY_AVAILABLE=$HAS_BUNNY_KEY"

      - name: Prepare verified Vercel source bundle
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const skip = new Set(['.git', '.next', 'node_modules']);
          const files = [];
          function walk(dir) {
            for (const name of fs.readdirSync(dir)) {
              if (skip.has(name)) continue;
              const full = path.join(dir, name);
              const st = fs.statSync(full);
              if (st.isDirectory()) walk(full);
              else {
                const rel = path.relative(process.cwd(), full).split(path.sep).join('/');
                if (rel === '.github/workflows/anime-witcher-verify.yml') continue;
                files.push({ file: rel, data: fs.readFileSync(full).toString('base64'), encoding: 'base64' });
              }
            }
          }
          walk(process.cwd());
          fs.writeFileSync('/tmp/anime-witcher-vercel-files.json', JSON.stringify(files));
          console.log('VERCEL_SOURCE_FILES', files.length);
          NODE

      - name: Upload verified source bundle
        uses: actions/upload-artifact@v4
        with:
          name: anime-witcher-vercel-files
          path: /tmp/anime-witcher-vercel-files.json
          retention-days: 1

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/anime-witcher-next.log || true
